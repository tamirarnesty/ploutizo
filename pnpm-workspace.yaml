packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@clerk/shared': true
  esbuild: true
  lefthook: true
  unrs-resolver: true
  bufferutil: false
  core-js: false
  msw: false
  utf-8-validate: false

overrides:
  iconv-lite@0.6.3: 0.7.2
  ws@7.5.10: 8.21.3
  '@tanstack/react-router': 1.170.8
  '@tanstack/router-core': 1.171.6
