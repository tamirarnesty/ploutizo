packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@clerk/shared': true
  esbuild: true
  lefthook: true
  unrs-resolver: true
  bufferutil: false
  core-js: false
  msw: false
  utf-8-validate: false

overrides:
  iconv-lite@0.6.3: 0.7.2
  ws@7.5.10: 8.21.3

permissions:
  '@tanstack/db':
    skills: true
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/react-db':
    skills: true
  '@tanstack/react-router':
    skills: true
  '@tanstack/react-start':
    skills: true
  '@tanstack/react-table':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  dotenv:
    skills: true
