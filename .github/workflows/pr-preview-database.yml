# Provisions an isolated Neon database branch for each Railway PR preview environment.
#
# Required GitHub secrets:
#   NEON_API_KEY        — from Neon GitHub integration (Integrations → GitHub)
#   RAILWAY_API_TOKEN   — account-scoped token from Railway account settings
#
# Required GitHub variables:
#   NEON_PROJECT_ID          — Neon project ID (e.g. misty-wave-12922807)
#   RAILWAY_PROJECT_ID       — Railway project ID
#   RAILWAY_API_SERVICE_ID   — Railway API service ID
#
# Optional GitHub variables:
#   NEON_PARENT_BRANCH       — Neon branch to fork from (default: production)
#   RAILWAY_PR_ENV_PREFIX    — Railway PR environment name prefix (default: ploutizo-pr)
#
# Notes:
#   Focused PR environments may skip the API when watch paths are unchanged. This
#   workflow still sets DATABASE_URL and runs `railway redeploy --from-source` to
#   deploy the API against the preview Neon branch.
#   Railway wait logic is inlined so PR-controlled repository files never run with
#   account-scoped credentials.
#
name: PR Preview Database

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

concurrency:
  group: pr-preview-database-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEON_BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
  RAILWAY_ENVIRONMENT_NAME: ${{ vars.RAILWAY_PR_ENV_PREFIX != '' && vars.RAILWAY_PR_ENV_PREFIX || 'ploutizo-pr' }}-${{ github.event.pull_request.number }}
  NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH != '' && vars.NEON_PARENT_BRANCH || 'production' }}

jobs:
  provision_preview_database:
    name: Provision preview database
    if: github.event.pull_request.draft == false && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.30.1

      - name: Compute Neon branch expiration
        id: expiration
        run: |
          echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch from production
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          database: ploutizo
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.expiration.outputs.expires_at }}

      - name: Refresh Neon branch expiration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          payload=$(jq -n --arg expires_at "${{ steps.expiration.outputs.expires_at }}" \
            '{branch: {expires_at: $expires_at}}')
          curl -sf -X PATCH \
            "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches/${{ steps.neon.outputs.branch_id }}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Wait for Railway PR environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          target_name="${{ env.RAILWAY_ENVIRONMENT_NAME }}"
          railway link -p "${{ vars.RAILWAY_PROJECT_ID }}" -e production >/dev/null
          for attempt in $(seq 1 36); do
            if railway environment list --ephemeral --json \
              | jq -e --arg name "$target_name" '.environments[] | select(.name == $name)' >/dev/null; then
              echo "Found Railway PR environment: ${target_name}"
              exit 0
            fi
            echo "Waiting for Railway PR environment ${target_name} (${attempt}/36)..."
            sleep 10
          done
          echo "Railway PR environment ${target_name} not found after 6 minutes" >&2
          exit 1

      - name: Set DATABASE_URL on Railway API service
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          printf '%s' "$DATABASE_URL" | railway variable set DATABASE_URL --stdin \
            --project "${{ vars.RAILWAY_PROJECT_ID }}" \
            --environment "${{ env.RAILWAY_ENVIRONMENT_NAME }}" \
            --service "${{ vars.RAILWAY_API_SERVICE_ID }}" \
            --skip-deploys

      - name: Deploy API with preview database
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          for attempt in $(seq 1 12); do
            if railway redeploy -y --from-source \
              --project "${{ vars.RAILWAY_PROJECT_ID }}" \
              --environment "${{ env.RAILWAY_ENVIRONMENT_NAME }}" \
              --service "${{ vars.RAILWAY_API_SERVICE_ID }}"; then
              echo "API deploy triggered from source"
              exit 0
            fi
            echo "Deploy not ready yet (${attempt}/12), retrying in 15s..."
            sleep 15
          done
          echo "Failed to deploy API after setting DATABASE_URL" >&2
          exit 1

  delete_preview_database:
    name: Delete preview database
    if: github.event.pull_request.draft == false && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
