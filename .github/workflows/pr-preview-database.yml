# Provisions an isolated Neon database branch for each Railway PR preview environment.
#
# Preview DBs are a fresh copy of production whenever API or DB schema changes.
# Web-only pushes skip this job so the preview database is left alone.
# Reused Neon branches are reset from production before migrate runs.
#
# Notes:
#   Focused PR environments may skip the API when watch paths are unchanged. This
#   workflow still sets DATABASE_URL and runs `railway redeploy --from-source` to
#   deploy the API against the preview Neon branch.
#   Path detection uses the GitHub compare API so this workflow never checks out
#   PR-controlled files while holding account-scoped Railway credentials.
name: PR Preview Database

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

concurrency:
  group: pr-preview-database-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NEON_BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
  RAILWAY_ENVIRONMENT_NAME: ${{ vars.RAILWAY_PR_ENV_PREFIX != '' && vars.RAILWAY_PR_ENV_PREFIX || 'ploutizo-pr' }}-${{ github.event.pull_request.number }}
  NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH != '' && vars.NEON_PARENT_BRANCH || 'production' }}

jobs:
  provision_preview_database:
    name: Provision preview database
    if: github.event.pull_request.draft == false && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Detect API or DB schema changes
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$PR_ACTION" != "synchronize" ]]; then
            echo "should_reset=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="$BEFORE_SHA"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/pr-preview-database.yml/runs?event=pull_request&per_page=20" \
              --jq --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" \
              '[.workflow_runs[] | select(.head_branch == $branch and .head_sha != $sha)] | first | .head_sha // empty')
          fi
          if [[ -z "$before" ]]; then
            before="$BASE_SHA"
          fi

          if ! files=$(gh api "repos/${{ github.repository }}/compare/${before}...${HEAD_SHA}" \
            --jq 'if .truncated == true then "truncated" else (.files[]?.filename // empty) end'); then
            echo "Could not compare ${before}...${HEAD_SHA}; resetting preview database from production"
            echo "should_reset=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$files" == "truncated" ]] || printf '%s\n' "$files" | grep -qE '^(apps/api/|packages/db/|drizzle\.config\.ts$)'; then
            echo "API or DB schema paths changed; resetting preview database from production"
            echo "should_reset=true" >> "$GITHUB_OUTPUT"
          else
            echo "No API or DB schema changes in this push; skipping preview database reset"
            echo "should_reset=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.preview.outputs.should_reset == 'true'
        run: npm install -g @railway/cli@5.30.1

      - name: Compute Neon branch expiration
        if: steps.preview.outputs.should_reset == 'true'
        id: expiration
        run: |
          echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch from production
        if: steps.preview.outputs.should_reset == 'true'
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          database: ploutizo
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.expiration.outputs.expires_at }}

      - name: Reset reused Neon branch from production
        if: steps.preview.outputs.should_reset == 'true' && steps.neon.outputs.created != 'true'
        uses: neondatabase/reset-branch-action@470ab8101095ea33737c294d17364a72fd80761b # v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Refresh Neon branch expiration
        if: steps.preview.outputs.should_reset == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          payload=$(jq -n --arg expires_at "${{ steps.expiration.outputs.expires_at }}" \
            '{branch: {expires_at: $expires_at}}')
          curl -sf -X PATCH \
            "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches/${{ steps.neon.outputs.branch_id }}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Wait for Railway PR environment
        if: steps.preview.outputs.should_reset == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          target_name="${{ env.RAILWAY_ENVIRONMENT_NAME }}"
          railway link -p "${{ vars.RAILWAY_PROJECT_ID }}" -e production >/dev/null
          for attempt in $(seq 1 36); do
            if railway environment list --ephemeral --json \
              | jq -e --arg name "$target_name" '.environments[] | select(.name == $name)' >/dev/null; then
              echo "Found Railway PR environment: ${target_name}"
              exit 0
            fi
            echo "Waiting for Railway PR environment ${target_name} (${attempt}/36)..."
            sleep 10
          done
          echo "Railway PR environment ${target_name} not found after 6 minutes" >&2
          exit 1

      - name: Set DATABASE_URL on Railway API service
        if: steps.preview.outputs.should_reset == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          printf '%s' "$DATABASE_URL" | railway variable set DATABASE_URL --stdin \
            --project "${{ vars.RAILWAY_PROJECT_ID }}" \
            --environment "${{ env.RAILWAY_ENVIRONMENT_NAME }}" \
            --service "${{ vars.RAILWAY_API_SERVICE_ID }}" \
            --skip-deploys

      - name: Deploy API with preview database
        if: steps.preview.outputs.should_reset == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          for attempt in $(seq 1 12); do
            if railway redeploy -y --from-source \
              --project "${{ vars.RAILWAY_PROJECT_ID }}" \
              --environment "${{ env.RAILWAY_ENVIRONMENT_NAME }}" \
              --service "${{ vars.RAILWAY_API_SERVICE_ID }}"; then
              echo "API deploy triggered from source"
              exit 0
            fi
            echo "Deploy not ready yet (${attempt}/12), retrying in 15s..."
            sleep 15
          done
          echo "Failed to deploy API after setting DATABASE_URL" >&2
          exit 1

  delete_preview_database:
    name: Delete preview database
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
